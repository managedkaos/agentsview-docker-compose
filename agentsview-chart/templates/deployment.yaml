apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-data-pvc
  namespace: {{ .Release.Namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: agentsview
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          args:
            - --public-url
            - http://localhost:{{ .Values.service.port }}
          ports:
            - containerPort: 8080
          env:
            - name: CLAUDE_PROJECTS_DIR
              value: /agents/claude
            - name: CODEX_SESSIONS_DIR
              value: /agents/codex
            - name: CURSOR_PROJECTS_DIR
              value: /agents/cursor
            - name: GEMINI_DIR
              value: /agents/gemini
            - name: KIRO_DIR
              value: /root/.kiro/sessions/cli
            - name: COPILOT_DIR
              value: /agents/copilot
          volumeMounts:
            - name: data-vol
              mountPath: /data
            - name: claude-vol
              mountPath: /agents/claude
              readOnly: true
            - name: codex-vol
              mountPath: /agents/codex
              readOnly: true
            - name: cursor-vol
              mountPath: /agents/cursor
              readOnly: true
            - name: gemini-vol
              mountPath: /agents/gemini
              readOnly: true
            - name: kiro-vol
              mountPath: /root/.kiro
              readOnly: true
            - name: copilot-vol
              mountPath: /agents/copilot
              readOnly: true
      volumes:
        - name: data-vol
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data-pvc
        - name: claude-vol
          hostPath:
            path: {{ .Values.homeDir }}/.claude/projects
            type: DirectoryOrCreate
        - name: codex-vol
          hostPath:
            path: {{ .Values.homeDir }}/.codex/sessions
            type: DirectoryOrCreate
        - name: cursor-vol
          hostPath:
            path: {{ .Values.homeDir }}/.cursor/projects
            type: DirectoryOrCreate
        - name: gemini-vol
          hostPath:
            path: {{ .Values.homeDir }}/.gemini
            type: DirectoryOrCreate
        - name: kiro-vol
          hostPath:
            path: {{ .Values.homeDir }}/.kiro
            type: DirectoryOrCreate
        - name: copilot-vol
          hostPath:
            path: {{ .Values.homeDir }}/.copilot
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-service
  namespace: {{ .Release.Namespace }}
spec:
  type: LoadBalancer
  selector:
    app: {{ .Release.Name }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
